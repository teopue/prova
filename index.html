<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Le mie abitudini</title>
  <meta name="description" content="Habit tracker personale: abitudini, studio e 3 priorità non negoziabili.">
  <meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Abitudini">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main id="main" class="main"></main>

  <nav class="tabbar" aria-label="Sezioni">
    <button class="tab" data-tab="oggi"><span class="tab-ico" aria-hidden="true">☀️</span>Oggi</button>
    <button class="tab" data-tab="progressi"><span class="tab-ico" aria-hidden="true">📈</span>Progressi</button>
    <button class="tab" data-tab="impostazioni"><span class="tab-ico" aria-hidden="true">⚙️</span>Impostazioni</button>
  </nav>

  <dialog id="habit-dialog" class="sheet">
    <form method="dialog" id="habit-form">
      <h3 id="habit-dialog-title">Nuova abitudine</h3>
      <label class="field">
        <span>Nome</span>
        <input name="name" required maxlength="40" placeholder="Es. Bere 2 litri d'acqua" autocomplete="off">
      </label>
      <fieldset class="emoji-pick">
        <legend>Icona</legend>
        <div class="emoji-grid" id="emoji-grid"></div>
      </fieldset>
      <div class="row end">
        <button class="btn ghost" value="cancel" formnovalidate>Annulla</button>
        <button class="btn primary" value="ok" id="habit-submit">Aggiungi</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
